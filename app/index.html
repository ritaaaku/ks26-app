<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.AppName}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; min-height: 5rem; box-sizing: border-box; font: inherit; padding: .5rem; }
  button { margin-top: .5rem; padding: .5rem 1.2rem; font: inherit; cursor: pointer; }
  #answer { margin-top: 1.5rem; padding: 1rem; border: 1px solid currentColor; border-radius: 6px; display: none; }
  #answer.degraded { border-color: #b58900; }
  .badge { display: inline-block; font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; border: 1px solid currentColor; margin-left: .5rem; }
  footer { margin-top: 3rem; font-size: .8rem; opacity: .7; }
</style>
</head>
<body>
  <h1>{{.AppName}}</h1>
  <p>輸入問題，送出後看回答。沒有推論後端時，這裡仍會回覆，只是標示為降級。</p>
  <form id="ask-form">
    <textarea id="question" placeholder="想問什麼？" required></textarea>
    <br>
    <button type="submit">送出問題</button>
  </form>
  <div id="answer"></div>
  <footer>owner: {{.Owner}} · image: {{.ImageTag}}</footer>
  <script>
    const form = document.getElementById('ask-form');
    const box = document.getElementById('answer');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question').value;
      box.style.display = 'block';
      box.className = '';
      box.textContent = '詢問中…';
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        box.className = data.degraded ? 'degraded' : '';
        box.textContent = data.answer || '';
        if (data.degraded) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '降級回覆';
          box.appendChild(badge);
        }
      } catch (err) {
        box.className = 'degraded';
        box.textContent = '請求失敗，請稍後再試。';
      }
    });
  </script>
</body>
</html>
