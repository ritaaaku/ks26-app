apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ks26-app
  labels:
    app.kubernetes.io/name: ks26-app
    app.kubernetes.io/part-of: ks26
spec:
  # Spelled out explicitly rather than relying on the cluster default: the
  # target cluster runs RKE2's built-in traefik.
  ingressClassName: traefik
  rules:
    - host: group1.52.194.49.7.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ks26-app
                port:
                  number: 80
