apiVersion: v1
kind: Service
metadata:
  name: ks26-app
  labels:
    app.kubernetes.io/name: ks26-app
    app.kubernetes.io/part-of: ks26
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ks26-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      # Must equal the deployment's containerPort — no guessing.
      targetPort: 8080
